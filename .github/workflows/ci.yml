name: CI — Backend & Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend — Lint, Typecheck, Unit Test
  # ─────────────────────────────────────────────
  backend-lint-test:
    name: Backend · Lint & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          # Nilai dummy agar module config tidak gagal saat unit test tanpa DB
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ''
          DB_DATABASE: peminjaman_ukri_test
          JWT_SECRET: ci-dummy-jwt-secret-unit-test
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-unit-test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Backend — Build
  # ─────────────────────────────────────────────
  backend-build:
    name: Backend · Build
    runs-on: ubuntu-latest
    needs: backend-lint-test
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Backend — Integration / E2E Test (dengan MySQL)
  # ─────────────────────────────────────────────
  backend-e2e:
    name: Backend · E2E Test
    runs-on: ubuntu-latest
    needs: backend-lint-test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: peminjaman_ukri_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migration:run
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ci_root_password
          DB_DATABASE: peminjaman_ukri_test
          JWT_SECRET: ci-dummy-jwt-secret-e2e
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-e2e

      - name: E2E tests
        run: npm run test:e2e -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ci_root_password
          DB_DATABASE: peminjaman_ukri_test
          JWT_SECRET: ci-dummy-jwt-secret-e2e
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-e2e

  # ─────────────────────────────────────────────
  # JOB 4: Frontend — Lint, Typecheck, Build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend · Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build (Vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

