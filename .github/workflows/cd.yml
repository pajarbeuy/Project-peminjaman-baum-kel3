name: CD — Deploy to Staging / Production

on:
  # Deploy ke staging otomatis setiap push ke develop
  push:
    branches: [develop]
  # Deploy ke production hanya via workflow_dispatch (manual trigger oleh PM/DevOps)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Pastikan hanya satu deployment berjalan sekaligus per environment
concurrency:
  group: cd-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Tentukan environment target
  # ─────────────────────────────────────────────
  determine-env:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────
  # Build Docker image Backend
  # ─────────────────────────────────────────────
  build-backend-image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: determine-env
    environment: ${{ needs.determine-env.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/baum-backend:${{ needs.determine-env.outputs.environment }}-${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/baum-backend:${{ needs.determine-env.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Build Docker image Frontend (served via nginx)
  # ─────────────────────────────────────────────
  build-frontend-image:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: determine-env
    environment: ${{ needs.determine-env.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/baum-frontend:${{ needs.determine-env.outputs.environment }}-${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/baum-frontend:${{ needs.determine-env.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Deploy ke server (SSH)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ needs.determine-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [determine-env, build-backend-image, build-frontend-image]
    environment: ${{ needs.determine-env.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull image terbaru
            docker pull ${{ secrets.REGISTRY_URL }}/baum-backend:${{ needs.determine-env.outputs.environment }}-latest
            docker pull ${{ secrets.REGISTRY_URL }}/baum-frontend:${{ needs.determine-env.outputs.environment }}-latest

            # Jalankan migration sebelum restart container
            docker run --rm \
              --network host \
              -e NODE_ENV=production \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_DATABASE=${{ secrets.DB_DATABASE }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }} \
              ${{ secrets.REGISTRY_URL }}/baum-backend:${{ needs.determine-env.outputs.environment }}-latest \
              npm run migration:run

            # Restart services dengan docker compose
            export BACKEND_IMAGE=${{ secrets.REGISTRY_URL }}/baum-backend:${{ needs.determine-env.outputs.environment }}-latest
            export FRONTEND_IMAGE=${{ secrets.REGISTRY_URL }}/baum-frontend:${{ needs.determine-env.outputs.environment }}-latest
            docker compose up -d --no-build

      - name: Notify deployment result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ENV="${{ needs.determine-env.outputs.environment }}"
          SHA="${{ github.sha }}"
          echo "Deployment ke $ENV: $STATUS (commit: ${SHA:0:7})"
          # Tambahkan notifikasi ke Slack/email di sini jika sudah dikonfirmasi PM
          # (Kanal notifikasi tambahan belum diputuskan — lihat project_context.md)

